<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Jan-You</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Georgia", serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #f6f3ef, #e9e4dc);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      width: 92%;
      max-width: 520px;
      background: #fdfbf8;
      padding: 34px;
      border-radius: 16px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.12);
      animation: floatUp 1s ease;
    }

    @keyframes floatUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 14px;
      color: #666;
    }

    label {
      display: block;
      margin-top: 18px;
      font-size: 13px;
      color: #444;
    }

    input, textarea {
      width: 100%;
      margin-top: 6px;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
      resize: none;
      background: #fff;
    }

    textarea {
      min-height: 90px;
    }

    button {
      margin-top: 22px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
      background: #1f2933;
      color: #fff;
      letter-spacing: 0.5px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.2);
    }

    .secondary {
      background: transparent;
      color: #333;
      border: 1px dashed #aaa;
    }

    #output {
      margin-top: 28px;
      line-height: 1.75;
      font-size: 15px;
      min-height: 140px;
      white-space: pre-line;
    }

    #signature {
      margin-top: 14px;
      font-size: 12px;
      color: #666;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .pulse {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(31,41,51,0.4); }
      70% { box-shadow: 0 0 0 10px rgba(31,41,51,0); }
      100% { box-shadow: 0 0 0 0 rgba(31,41,51,0); }
    }
  </style>
</head>

<body>

  <div class="card">
    <h1 id="title"></h1>
    <div class="subtitle">A quiet conversation with yourself.</div>

    <label for="name">Your name (optional)</label>
    <input id="name" placeholder="You can leave this empty" />

    <label for="goal">Your New Year resolution</label>
    <textarea id="goal" placeholder="What are you really trying to change?"></textarea>

    <button id="askBtn" class="pulse">Ask Me</button>
    <button id="resetBtn" class="secondary">Ask again, but more honestly</button>
